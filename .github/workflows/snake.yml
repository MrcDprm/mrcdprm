name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # her gün gece yarısı (UTC) çalışır
  workflow_dispatch:        # Actions sekmesinden elle de tetiklenebilir
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 2026 boyunca sadece 2026 verisi, 2027'den itibaren son 1 yıl (bkz. .github/scripts/snake.mjs)
      - name: Generate contribution snake SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install --no-save --no-package-lock generate-snake-animation@3.5.0
          node .github/scripts/snake.mjs \
            --github_user=${{ github.repository_owner }} \
            --output=dist/github-contribution-grid-snake.svg \
            --output="dist/github-contribution-grid-snake-dark.svg?palette=github-dark"

      - name: Push snake SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
